name: Build & Release APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 签名材料由 Secrets 注入（见 SIGNING.md）
  KEYSTORE_PATH: signing/treasure-vault.jks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build metadata
        run: |
          echo "=========== Treasure Vault (native) ==========="
          echo "Run        : #${{ github.run_number }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Gradle ver : $(grep -m1 'versionName' app/build.gradle.kts)"
          echo "==============================================="

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，拒绝以 debug 签名构建"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "keystore bytes: $(stat -c%s "$KEYSTORE_PATH")"

      - name: Verify signing fingerprint (pre-build)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED=$(tr -d ' :\n\r' < signing/fingerprint.txt | tr 'A-F' 'a-f')
          ACTUAL=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ' :\r' | tr 'A-F' 'a-f')
          echo "expected: $EXPECTED"; echo "actual  : $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::签名证书与固定指纹不一致"; exit 1; }
          echo "✅ 签名证书指纹一致"

      - name: Verify version consistency
        run: |
          set -euo pipefail
          NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([0-9.]+)".*/\1/')
          CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*= *([0-9]+).*/\1/')
          NOTE=$(grep -m1 '"[0-9]+\.[0-9]+\.[0-9]+", "' app/src/main/kotlin/com/suibian/treasure_vault/core/AppInfo.kt \
            | sed -E 's/.*"([0-9.]+)".*/\1/')
          echo "gradle: $NAME ($CODE) | notes: $NOTE"
          [ "$NAME" = "$NOTE" ] || { echo "::error::版本号与更新日志不一致"; exit 1; }

      - name: Assemble release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI: "true"
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -euo pipefail
          VER=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([0-9.]+)".*/\1/')
          mv app/build/outputs/apk/release/app-release.apk "TreasureVault-$VER.apk"
          ls -lh "TreasureVault-$VER.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Verify launcher activity exists in APK
        run: |
          set -euo pipefail
          if ! unzip -p "TreasureVault-$VER.apk" 'classes*.dex' | grep -a -q 'Lcom/suibian/treasure_vault/MainActivity;'; then
            echo "::error::APK 缺少入口 MainActivity，安装后会闪退"
            exit 1
          fi
          echo "✅ 含入口 MainActivity"

      - name: Verify APK signature (post-build)
        run: |
          set -euo pipefail
          EXPECTED=$(tr -d ' :\n\r' < signing/fingerprint.txt | tr 'A-F' 'a-f')
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "TreasureVault-$VER.apk" \
            | grep -m1 'SHA-256 digest' | sed 's/.*digest: //' | tr -d ' :\r' | tr 'A-F' 'a-f')
          echo "expected: $EXPECTED"; echo "actual  : $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::APK 签名指纹不一致"; exit 1; }
          echo "✅ APK 签名一致"

      - name: Build report
        run: |
          echo "=========== APK inventory ==========="
          ls -l "TreasureVault-$VER.apk"
          sha256sum "TreasureVault-$VER.apk"
          echo "====================================="

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: treasure-vault-apk
          path: TreasureVault-*.apk
          retention-days: 7

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$VER"
          printf '## 宝藏盒 v%s\n\n- 原生 Android 重构：Kotlin + 原生 View，去掉 Flutter 引擎，安装包与常驻内存大幅下降。\n- 新增「主题设置」页（6 套配色 / 明暗模式 / 底部导航样式）与页面、工具过渡动画。\n- 掷骰子、抛硬币、随机抽签加入真实动效。\n- 工具持续扩充中，详细清单见仓库 README。\n' "$VER" > body.md
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "宝藏盒 v$VER" --notes-file body.md
          else
            gh release edit "$TAG" --title "宝藏盒 v$VER" --notes-file body.md
          fi
          gh release upload "$TAG" "TreasureVault-$VER.apk" --clobber
          echo "✅ 已发布 $TAG"
