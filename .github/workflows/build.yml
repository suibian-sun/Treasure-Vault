name: Build & Release APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 签名材料由 Secrets 注入（见 SIGNING.md）
  KEYSTORE_PATH: signing/treasure-vault.jks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build metadata
        run: |
          echo "=========== Treasure Vault (native) ==========="
          echo "Run        : #${{ github.run_number }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Gradle ver : $(grep -m1 'versionName' app/build.gradle.kts)"
          echo "==============================================="

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，拒绝以 debug 签名构建"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "keystore bytes: $(stat -c%s "$KEYSTORE_PATH")"

      - name: Verify signing fingerprint (pre-build)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED=$(tr -d ' :\n\r' < signing/fingerprint.txt | tr 'A-F' 'a-f')
          ACTUAL=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ' :\r' | tr 'A-F' 'a-f')
          echo "expected: $EXPECTED"; echo "actual  : $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::签名证书与固定指纹不一致"; exit 1; }
          echo "✅ 签名证书指纹一致"

      - name: Verify version consistency
        run: |
          set -euo pipefail
          NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([0-9.]+)".*/\1/')
          CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*= *([0-9]+).*/\1/')
          NOTE=$(grep -m1 -E '"[0-9]+\.[0-9]+\.[0-9]+", "' app/src/main/kotlin/com/suibian/treasure_vault/core/AppInfo.kt \
            | sed -E 's/.*"([0-9.]+)".*/\1/')
          echo "gradle: $NAME ($CODE) | notes: $NOTE"
          [ "$NAME" = "$NOTE" ] || { echo "::error::版本号与更新日志不一致"; exit 1; }

      - name: Assemble release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI: "true"
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -euo pipefail
          VER=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([0-9.]+)".*/\1/')
          cd app/build/outputs/apk/release
          for f in app-*-release.apk; do
            ABI=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "../../../../../TreasureVault-$VER-$ABI.apk"
          done
          cd -
          ls -lh TreasureVault-*.apk
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Verify launcher activity exists in APK
        run: |
          set -euo pipefail
          for apk in TreasureVault-*.apk; do
            if ! unzip -p "$apk" 'classes*.dex' | grep -a -q 'Lcom/suibian/treasure_vault/MainActivity;'; then
              echo "::error::$apk 缺少入口 MainActivity，安装后会闪退"
              exit 1
            fi
            echo "✅ $apk 含入口 MainActivity"
          done

      - name: Verify APK signature (post-build)
        run: |
          set -euo pipefail
          EXPECTED=$(tr -d ' :\n\r' < signing/fingerprint.txt | tr 'A-F' 'a-f')
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in TreasureVault-*.apk; do
            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" \
              | grep -m1 'SHA-256 digest' | sed 's/.*digest: //' | tr -d ' :\r' | tr 'A-F' 'a-f')
            echo "$apk expected: $EXPECTED actual: $ACTUAL"
            [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::$apk 签名指纹不一致"; exit 1; }
          done
          echo "✅ 所有 APK 签名一致"

      - name: Build report
        run: |
          echo "=========== APK inventory ==========="
          ls -l TreasureVault-*.apk
          sha256sum TreasureVault-*.apk
          echo "====================================="

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: treasure-vault-apk
          path: TreasureVault-*.apk
          retention-days: 7

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$VER"
          {
            echo "## 宝藏盒 v$VER"
            echo
            echo "工具总数 **138 个**，全部本地运行；按 CPU 架构分包下载（按需选择 arm64-v8a 或 armeabi-v7a）。"
            echo
            echo "### 本次新增"
            echo "- 图片：水印 / 九宫格 / 拼接 / 放大 / 锐化 / 拉伸修复 / 黑白上色 / 取色器 / 配色助手 / 证件照 / 表情包 / 带壳截图 / 文字转图 / 渐变图 / 拼豆图纸 / 隐藏图 / GIF 合成与分解 / 画板"
            echo "- 识别：OCR 文字识别 / 表格转 CSV / 二维码生成与识别 / 以图搜图 / 拍照计数"
            echo "- 文本：文本编辑器 / 拆分选词 / 中文转拼音 / 汉语词典 / 成语 / 近反义词 / 藏头诗 / 对联 / TextRank 摘要"
            echo "- 传感：屏幕直尺 / 气泡水平仪 / 指南针 / 噪音计 / 金属探测仪"
            echo "- 影音：白噪音 / 文字转语音 / 视频提取音轨 / 氢壁纸 / 系统壁纸导出"
            echo "- 系统：大文件 / 空文件 / 空文件夹 / 安装包清理，手机端 FTP 局域网传输"
            echo "- 查询：快递单号识别 / 手机号运营商 / 城市邮编 / 地址解析（均离线）"
            echo
            echo "### 说明"
            echo "- OCR 首次使用需联网下载中文识别模型（端侧运行，图片不上传）。"
            echo "- 存储清理需要「所有文件访问」权限，首次使用会引导授权。"
          } > body.md
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "宝藏盒 v$VER" --notes-file body.md
          else
            gh release edit "$TAG" --title "宝藏盒 v$VER" --notes-file body.md
          fi
          gh release upload "$TAG" TreasureVault-*.apk --clobber
          echo "✅ 已发布 $TAG"
